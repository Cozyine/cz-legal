<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cozine</title>
  <link rel="icon" href="static/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="progress"></div>
  <header class="site-head">
    <span class="logo-ring"><img class="logo" src="static/logo.png" alt="Cozine"></span>
    <span class="brand">Cozine</span>
    <span class="status"><span class="dot"></span>Operational</span>
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
      <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
  </header>

  <main class="hero">
    <div class="title-row">
      <h1>Cozine</h1>
      <span class="badge" tabindex="0" aria-label="Version 1.0.0 changelog">
        <span class="badge-text">v1.0.0</span>
        <span class="badge-more">What's new</span>
        <span class="badge-pin" aria-hidden="true"><img src="static/Pin.png" alt=""></span>
        <div class="changelog">
          <div class="changelog-head">v1.0.0</div>
          <ul>
            <li>test changelog</li>
          </ul>
        </div>
      </span>
    </div>
    <p class="tag">A simple tool for server mods to flag and catch roblox <span class="accent">exploiters</span>.</p>
    <div class="btns">
      <a class="btn primary" href="https://panel.cozine.xyz"><span>Go to Panel <svg class="btn-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></span></a>
      <a class="btn ghost" href="tos/"><span>Terms of Service</span></a>
      <a class="btn ghost" href="privacy/"><span>Privacy policy</span></a>
    </div>
  </main>

  <footer class="site-foot">© <span id="year"></span> Cozine · v1.0.0 release</footer>

  <a class="discord-pill" href="https://discord.gg/3ZBebypZJS" target="_blank" rel="noopener" aria-label="Support server">
    <img src="static/discord.svg" alt="">
    <span>Support server</span>
  </a>

  <script src="static/common.js"></script>
  <script src="static/script.js"></script>
</body>
</html>
